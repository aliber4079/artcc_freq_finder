name: Hello World

on:
  push:
  workflow_dispatch:

jobs:
  run-hello-world:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run hello world script
        run: python hello_world.py
