name: Discover Sector Sources

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install requests==2.32.3
      - run: python discover_sector_sources.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload discovered sector sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sector-sources
          if-no-files-found: warn
          path: |
            sector_sources/
            sector_sources_manifest.json
